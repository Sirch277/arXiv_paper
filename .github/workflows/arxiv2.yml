name: arXiv monitor

on:
  schedule:
    - cron: '0 0 * * 1'   # Mondays 00:00 UTC = 08:00 Beijing time (GitHub cron is always UTC)
  workflow_dispatch:        # adds a manual "Run workflow" button for testing

# Prevent overlapping runs from racing each other on the git push.
# If a run is already in progress, new triggers wait instead of colliding.
concurrency:
  group: arxiv-monitor
  cancel-in-progress: false

permissions:
  contents: write           # allows the bot to commit the digest + memory back

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # full history so `git pull --rebase` has something to rebase onto

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Run the agent
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}     # optional; empty = free heuristic brain
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}      # optional
          LLM_MODEL: ${{ vars.LLM_MODEL }}            # optional
        run: python run.py    # auto brain: uses the LLM if the secret exists, else heuristic

      - name: Commit digest and memory back to the repo
        run: |
          git config user.name "arxiv-monitor-bot"
          git config user.email "actions@github.com"

          mkdir -p digests memory
          git add digests memory
          git diff --cached --quiet || git commit -m "digest: $(date +%F)"

          # Retry loop: handles the case where main moved between checkout and push
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            echo "Push attempt $i failed, retrying in 5s..."
            sleep 5
          done
